version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: miguelzambrano/backend-ecommerce:1.0.0
    container_name: backend-ecommerce
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - URL_MONGODB=mongodb://mongo:27017/ecommerce
      - JWT_SECRET=${JWT_SECRET:-default-secret-change-in-production}
      - MAIL_USER=${MAIL_USER:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
    depends_on:
      - mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7-alpine
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: